<title>かんじ牧場 うごくデモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* layout: one scene fills the width, controls below; single bright daytime look */
:root{
  --bg:#dff3ff; --fg:#2a2a3a; --sky1:#bfe7ff; --sky2:#e9f8ff; --grass:#9bdc7a; --grass2:#7cc45e;
  --pond:#6fc6f3; --card:#ffffff; --accent:#ff7a59; --muted:#6b5f4a; color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:clamp(20px,4vw,28px);font-weight:900;display:flex;align-items:center;gap:10px}
h1 span{background:var(--accent);color:#fff;border-radius:10px;padding:2px 10px;font-size:.75em}
.scene{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:20px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 55%,var(--grass) 55%,var(--grass2));touch-action:manipulation;display:block}
.hint{font-size:14px;color:var(--muted);font-weight:700;margin:0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;font-weight:900;font-size:16px;border:3px solid var(--fg);background:var(--card);color:var(--fg);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 var(--fg)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tap{cursor:pointer}
/* animations */
@keyframes walk{0%{transform:translateX(-160px)}100%{transform:translateX(820px)}}
@keyframes rock{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes footL{0%,100%{transform:translate(0,0)}50%{transform:translate(-10px,-10px)}}
@keyframes footR{0%,100%{transform:translate(-10px,-10px)}50%{transform:translate(0,0)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-34px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.06,.92)}}
@keyframes spark{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}}
@keyframes rays{0%,100%{transform:rotate(0deg)}50%{transform:rotate(12deg)}}
@keyframes flash{0%{opacity:0;r:0}40%{opacity:.9}100%{opacity:0;r:140px}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ripple{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.6);opacity:0}}
.walker{animation:walk 11s linear infinite}
.rock{transform-origin:80px 130px;animation:rock 1s ease-in-out infinite}
.fl{animation:footL 1s ease-in-out infinite}.fr{animation:footR 1s ease-in-out infinite}
.hop{transform-origin:80px 150px;animation:hop 1.1s ease-in-out infinite}
.spL{transform-origin:30px 92px;animation:spark 1.1s ease-in-out infinite}.spR{transform-origin:130px 92px;animation:spark 1.1s ease-in-out infinite reverse}
.z1{animation:zz 2.4s ease-in-out infinite}.z2{animation:zz 2.4s ease-in-out .9s infinite}
.rays{transform-origin:80px 82px;animation:rays 3s ease-in-out infinite}
.pop{transform-origin:80px 150px;animation:pop .6s cubic-bezier(.3,1.4,.5,1) both}
.flash{animation:flash .7s ease-out both}
.rip{transform-origin:80px 150px;animation:ripple 2s ease-out infinite}
.tree{transition:transform .8s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.walker,.rock,.fl,.fr,.hop,.spL,.spR,.z1,.z2,.rays,.rip{animation:none}.tree{transition:none}}
</style>

          <ellipse cx="62" cy="150" rx="12" ry="6" fill="#8b5a2b" stroke="#2a2a3a" stroke-width="4"/><ellipse cx="98" cy="150" rx="12" ry="6" fill="#8b5a2b" stroke="#2a2a3a" stroke-width="4"/>

    <ellipse cx="640" cy="60" rx="50" ry="18" fill="#fff" opacity=".8"/>
    <ellipse cx="600" cy="330" rx="150" ry="52" fill="#4fa7d8"/><ellipse cx="600" cy="326" rx="140" ry="46" fill="#6fc6f3"/>
    <g id="pondRip" class="rip" transform="translate(520,176)"><ellipse cx="80" cy="150" rx="40" ry="14" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/></g>

      <line x1="40" y1="280" x2="40" y2="350"/><line x1="130" y1="280" x2="130" y2="350"/><line x1="220" y1="280" x2="220" y2="350"/><line x1="300" y1="280" x2="300" y2="350"/></g>

    <!-- ひーさま（池の上の空） tap -->

        <line x1="80" y1="4" x2="80" y2="18"/><line x1="26" y1="28" x2="36" y2="38"/><line x1="134" y1="28" x2="124" y2="38"/>
        <line x1="12" y1="82" x2="26" y2="82"/><line x1="148" y1="82" x2="134" y2="82"/><line x1="30" y1="134" x2="40" y2="126"/><line x1="130" y1="134" x2="120" y2="126"/>
      </g>

        <path d="M57,70 Q66,78 75,70 M85,70 Q94,78 103,70" fill="none" stroke="#2a2a3a" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="80" cy="108" rx="4" ry="5" fill="#c0392b" stroke="#2a2a3a" stroke-width="3"/>
        <g class="z1"><path d="M118,40 L130,40 L118,52 L130,52" fill="none" stroke="#2a2a3a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
        <g class="z2"><path d="M134,24 L144,24 L134,34 L144,34" fill="none" stroke="#2a2a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      </g>
      <g id="sunAwake" style="display:none">
        <path d="M57,70 Q66,58 75,70 M85,70 Q94,58 103,70" fill="none" stroke="#2a2a3a" stroke-width="4" stroke-linecap="round"/>
        <path d="M66,104 Q73,114 80,104 Q87,114 94,104" fill="none" stroke="#2a2a3a" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <ellipse cx="52" cy="86" rx="8" ry="5" fill="#ff8aa8" opacity=".7"/><ellipse cx="108" cy="86" rx="8" ry="5" fill="#ff8aa8" opacity=".7"/>
      <path d="M50,92 L110,92" stroke="#2a2a3a" stroke-width="4" stroke-linecap="round"/>

    <!-- ひーくん（跳ねる） -->
    <g transform="translate(330,250) scale(.8)">
      <ellipse cx="80" cy="152" rx="40" ry="6" fill="#000" opacity=".15"/>
      <g class="hop">

        <path class="spR" d="M130,62 C122,74 124,88 134,92 C144,88 146,74 130,62 Z" fill="#ffb347" stroke="#2a2a3a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M80,16 C100,48 128,68 124,106 C121,136 98,150 80,150 C62,150 39,136 36,106 C32,68 60,48 80,16 Z" fill="#ff6b3d" stroke="#2a2a3a" stroke-width="5" stroke-linejoin="round"/>
        <path d="M80,16 C60,48 32,68 36,106 C39,136 62,150 80,150 L82,150 L82,16 Z" fill="#000" opacity=".12"/>

      <g id="treeA" class="tree" transform="translate(0,0)"><use href="#ki-sleep"/></g>
      <g id="treeB" class="tree" transform="translate(150,0)"><use href="#ki-sleep"/></g>

      <g id="hayashiG" class="tap" transform="translate(0,0)" style="display:none" role="button" aria-label="林をもどす"><g stroke="#8b5a2b" stroke-width="13" stroke-linecap="round" fill="none"><path d="M100,92 Q120,78 146,92"/><path d="M130,92 Q110,78 84,92"/></g><use href="#hayashi" x="20" y="12"/><use href="#hayashi" x="90" y="12"/></g>

  <p class="hint">やまちゃんは歩き、ひーくんは跳ねています。ひーさま（太陽）と、できあがった林はタップできます。</p>
  <div class="btns">

    <button id="btnWake" type="button">ひーさまを おこす</button>
  </div>
</div>

<script>
(function(){
  var joined=false, awake=false;
  var treeA=document.getElementById('treeA'), treeB=document.getElementById('treeB');
  var hayashi=document.getElementById('hayashiG'), flash=document.getElementById('flash');
  var btnJoin=document.getElementById('btnJoin'), btnWake=document.getElementById('btnWake');
  var rays=document.getElementById('rays'), sunSleep=document.getElementById('sunSleep'), sunAwake=document.getElementById('sunAwake'), sunBody=document.getElementById('sunBody');

  var ctx=null;
  function beep(freqs){
    try{
      if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
      var t=ctx.currentTime;
      freqs.forEach(function(f,i){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type='triangle'; o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t+i*0.12); g.gain.exponentialRampToValueAtTime(0.25,t+i*0.12+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.12+0.3);
        o.connect(g); g.connect(ctx.destination); o.start(t+i*0.12); o.stop(t+i*0.12+0.32);
      });
    }catch(e){}
  }

  function join(){
    if(joined) return;
    joined=true; btnJoin.disabled=true;
    treeA.setAttribute('transform','translate(50,0)');
    treeB.setAttribute('transform','translate(100,0)');
    beep([523,659]);
    setTimeout(function(){
      flash.classList.remove('flash'); void flash.getBoundingClientRect(); flash.classList.add('flash');
      beep([659,784,1047]);
      setTimeout(function(){
        treeA.style.display='none'; treeB.style.display='none';
        hayashi.style.display=''; hayashi.classList.remove('pop'); void hayashi.getBoundingClientRect(); hayashi.classList.add('pop');
        btnJoin.textContent='林になった！ 2本で かたぐみ（タップでもどす）';
      },300);
    },850);
  }
  function split(){
    if(!joined) return;
    joined=false;
    hayashi.style.display='none';
    treeA.style.display=''; treeB.style.display='';
    treeA.setAttribute('transform','translate(0,0)'); treeB.setAttribute('transform','translate(150,0)');
    btnJoin.disabled=false; btnJoin.textContent='きーぼうを となりにする';
    beep([784,523]);
  }
  function toggleSun(){
    awake=!awake;
    rays.style.display=awake?'':'none';
    sunSleep.style.display=awake?'none':'';
    sunAwake.style.display=awake?'':'none';
    sunBody.setAttribute('fill',awake?'#ffd23f':'#e8c56b');
    btnWake.textContent=awake?'ひーさまを ねかせる':'ひーさまを おこす';
    beep(awake?[392,523,659]:[523,392]);
  }
  btnJoin.addEventListener('click',join);
  hayashi.addEventListener('click',split);
  btnWake.addEventListener('click',toggleSun);
  document.getElementById('hisama').addEventListener('click',toggleSun);
})();
</script>
