<title>かんじぼうけん</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap">
<style>
/* 冒険ゲームの1色の世界（テーマ切替なし・色はすべて明示）。上に木の看板バー、下に画面いっぱいのフィールド */
:root{
  --sky:#d8efff; --paper:#fffaf0; --wood:#8b5a2b;
  --ink:#2a2a3a; --ink2:#6b5f4a; --accent:#ff7a59; --blue:#3b6fd9; --gold:#ffd23f; --good:#5fb860;
  --font:'Zen Maru Gothic',system-ui,sans-serif; --hand:'Klee One','Zen Maru Gothic',serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:#7cc36a;color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:var(--ink);cursor:pointer}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--wood);color:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.15);flex:0 0 auto;z-index:5}
.bar h1{margin:0;font-size:20px;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.bar .sp{flex:1 1 auto}
.navb{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:7px 14px;font-size:17px;font-weight:900;white-space:nowrap}
.navb[aria-current="true"]{background:var(--gold)}
.pill{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;background:rgba(255,255,255,.16);border-radius:12px;padding:4px 10px;white-space:nowrap}
.gear{background:none;border:none;color:var(--paper);font-size:14px;font-weight:700;opacity:.8;padding:6px}
main{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow:auto}
.pad16{padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* フィールド */
#field{overflow:hidden;background:#5a9e3a;display:flex;align-items:center;justify-content:center}
#fieldSvg{width:100%;height:100%;display:block;touch-action:manipulation}
#hero,.mob{transition:transform .17s linear}
.mapname{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:12px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:3px 14px;font-weight:900;font-size:18px;pointer-events:none}
.tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 16px;font-weight:900;font-size:17px;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.dpad{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;opacity:.92}
.dpad button{border:3px solid var(--ink);border-radius:14px;background:var(--paper);font-size:22px;font-weight:900;padding:0}
.dpad button:active{background:var(--gold)}
.eggshine{animation:eggbob 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes eggbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.mobbob{animation:squish 1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes squish{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}
/* たまご・バトル共通 */
.duel{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:6px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bigegg{width:min(300px,38vw,calc(100vh - 300px));aspect-ratio:150/180;max-width:100%}
.bigegg svg{width:100%;height:100%;overflow:visible}
.stage{position:relative;width:min(440px,52vw,calc(100vh - 260px));aspect-ratio:1/1;max-width:100%;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 rgba(42,42,58,.25);touch-action:none}
.stage svg{width:100%;height:100%;display:block}
.say{font-size:21px;font-weight:900;text-align:center;margin:8px 0 0;min-height:1.4em;text-wrap:balance}
.count{font-size:17px;font-weight:900;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:3px 12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:300px}
.dots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:block}
.dots i.on{background:var(--gold)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn{background:var(--paper);border:4px solid var(--ink);border-radius:20px;font-size:19px;font-weight:900;padding:9px 20px;box-shadow:0 4px 0 var(--ink)}
.btn.go{background:var(--accent);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#egg,#battle{background:#cfeec0}
#battle{background:linear-gradient(#d8efff 0 55%,#9ad36b 55%)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.35);opacity:.55}}
.wob{animation:wob .35s}
@keyframes wob{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:50% 90%}
@keyframes pop{0%{transform:scale(.1);opacity:0}100%{transform:none;opacity:1}}
.conf{animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(220px) rotate(320deg);opacity:0}}
.lunge{animation:lunge .5s ease-in-out}
@keyframes lunge{40%{transform:translate(40px,-14px) scale(1.08)}100%{transform:none}}
.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(10px);filter:brightness(2)}50%{transform:translateX(-8px)}100%{transform:none}}
.vanish{animation:vanish .8s forwards}
@keyframes vanish{to{transform:scale(1.6) rotate(20deg);opacity:0}}
.hp{display:flex;gap:6px}
.hp i{width:26px;height:22px;display:block;background:radial-gradient(circle at 30% 35%,#ff8aa8 0 40%,#e04a4a 41%);border:3px solid var(--ink);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.hp i.off{background:#ddd}
.party{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.pick{width:128px;background:var(--paper);border:4px solid var(--ink);border-radius:20px;padding:6px;display:flex;flex-direction:column;align-items:center}
.pick svg{width:100px;height:100px}
.pick b{font-size:22px}
.pick{position:relative}
.pick small{font-size:13px;font-weight:900;color:var(--ink2)}
.pick.strong{background:#fff3c4;border-color:#e6a400;box-shadow:0 0 0 4px #ffd23f}
.pick .badge{position:absolute;top:-12px;right:-8px;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:12px;font-size:13px;font-weight:900;padding:1px 8px}
.hintbox,.meanbox{background:var(--paper);border:3px dashed #c9a66b;border-radius:16px;padding:8px 14px;font-weight:700;font-size:16px;line-height:1.6;max-width:640px;margin:8px auto 0;text-align:center}
.lv{background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 6px;font-size:14px}
.bigstar,.flystar{position:absolute;color:#ffd23f;font-size:84px;line-height:1;pointer-events:none;z-index:8;-webkit-text-stroke:3px #2a2a3a;text-shadow:0 0 18px #fff6a0,0 0 36px #ffd23f}
.flystar{font-size:34px;-webkit-text-stroke:2px #2a2a3a}
.levelup{animation:levelup 1.2s ease-out}
@keyframes levelup{0%{filter:drop-shadow(0 0 0 #ffd23f)}30%{transform:scale(1.18);filter:drop-shadow(0 0 22px #ffd23f) brightness(1.3)}100%{transform:none;filter:none}}
.lvpop{position:absolute;transform:translate(-50%,-50%);font-size:44px;font-weight:900;color:#fff;-webkit-text-stroke:3px #2a2a3a;background:none;z-index:9;animation:lvpop 2.2s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes lvpop{0%{transform:translate(-50%,-30%) scale(.3);opacity:0}20%{transform:translate(-50%,-50%) scale(1.2);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-90%);opacity:0}}
#battle{position:absolute}
.mon{width:min(220px,30vw)}
.mon svg{width:100%;height:auto;overflow:visible}
.fighter{width:min(200px,28vw)}
.fighter svg{width:100%;height:auto;overflow:visible}
/* かんじ牧場（コレクション） */
#ranch{background:#fff8e6}
.pasture{position:relative;height:clamp(200px,38vh,340px);border:4px solid var(--ink);border-radius:26px;overflow:hidden;background:linear-gradient(#d8efff 0 38%,#9ad36b 38%)}
.pasture .fence{position:absolute;left:0;right:0;top:36%;height:18px;background:repeating-linear-gradient(90deg,#c9a66b 0 6px,transparent 6px 40px);border-top:5px solid #c9a66b;border-bottom:5px solid #c9a66b;opacity:.8}
.critter{position:absolute;width:96px;height:96px;border:none;background:none;padding:0;transform:translate(-50%,-50%);transition:left 2.6s ease-in-out,top 2.6s ease-in-out}
.critter svg{width:100%;height:100%;overflow:visible}
.critter .bob{animation:bob 1.6s ease-in-out infinite;width:100%;height:100%}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:var(--ink2);text-align:center;padding:16px}
.ztitle{font-size:22px;font-weight:900;margin:16px 0 8px}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.zcard{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px}
.zcard svg{width:78px;height:78px}
.zcard .g{font-size:22px;font-weight:900;line-height:1}
.zcard .n{font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.zcard.locked{background:#efe8d8;border-style:dashed}
.zcard.locked .n{color:#a89f8a}
.zcard .no{font-size:10px;color:var(--ink2);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(42,42,58,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:16px;width:min(560px,100%);max-height:92%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.sheet .duo{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.sheet .duo svg{width:min(190px,38vw);height:min(190px,38vw)}
.data{display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:16px}
.data dt{color:var(--ink2);font-weight:700}
.data dd{margin:0;font-weight:900;font-variant-numeric:tabular-nums}
.small{font-size:13px;color:var(--ink2);text-align:center;line-height:1.6}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:8px 16px;font-weight:900;z-index:30}
.drawon{transition:stroke-dashoffset .7s ease}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:640px){.bar h1{font-size:16px}.navb{font-size:14px;padding:5px 9px}.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.stage{width:min(440px,88vw)}.bigegg{width:min(200px,50vw)}}
/* v3：せかい・かいわ・ボス */
body.nobar .bar{display:none}
#world{transition:transform .17s linear}
#world.noanim{transition:none}
#field.fadein{animation:fadein .5s ease}
@keyframes fadein{from{opacity:.2}to{opacity:1}}
.npcbob{animation:bob2 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
.bounce{animation:bounce .8s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-2px)}}
.arrowui{animation:none}
.mapname{max-width:60vw}
.prog{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:56px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:2px 12px;font-weight:700;font-size:15px;pointer-events:none}
.prog b{font-weight:900}
.bossmark{color:#fff;background:#e04a4a;border-radius:8px;padding:0 6px}
ruby.kj{color:var(--blue);font-weight:900}
rt{font-size:.5em;color:var(--ink2);font-weight:700}
.mapname rt{font-size:.55em}
#field.talking .dpad,#field.talking .tip{display:none}
#talk{position:absolute;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:14px;z-index:6;background:var(--paper);border:4px solid var(--ink);border-radius:22px;display:flex;gap:14px;align-items:center;padding:10px 16px;box-shadow:0 5px 0 rgba(42,42,58,.25);cursor:pointer;min-height:100px;max-width:900px;margin:0 auto}
#talk .face{width:84px;height:84px;flex:0 0 auto;background:#e8f6d8;border:3px solid var(--ink);border-radius:18px;overflow:hidden}
#talk .face svg{width:100%;height:100%;display:block}
#talk .who{font-size:15px;font-weight:900;color:var(--ink2)}
#talk .txt{font-size:23px;font-weight:900;line-height:2}
#talk .nxt{position:absolute;right:14px;bottom:4px;font-size:16px;color:var(--accent);animation:bounce .8s ease-in-out infinite}
.typein{animation:typein .35s ease}
@keyframes typein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#title{background:linear-gradient(#bfe6ff 0 58%,#9ad36b 58%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px}
.logo{margin:0;font-size:clamp(44px,9vw,92px);font-weight:900;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:.06em;line-height:1.1}
.logo.small{font-size:clamp(36px,6vw,60px);text-align:center}
.sub{margin:0;font-size:20px;font-weight:900;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:4px 16px}
.titleart{width:min(640px,92vw)}
.titleart>svg{width:100%;height:auto;display:block}
.btn.big{font-size:26px;padding:12px 40px}
#story{padding:16px;background:#2a2a3a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.panel{width:min(760px,94vw,calc((100vh - 230px)*1.6));aspect-ratio:16/10;border:5px solid #fff;border-radius:24px;overflow:hidden;background:#fff;flex:0 0 auto}
.panel>svg{width:100%;height:100%;display:block}
.storytxt{color:#fff;font-size:22px;font-weight:900;max-width:760px;text-align:center;line-height:1.7;margin:0}
.storytxt.dark{color:var(--ink)}
.back{text-align:center;font-weight:900;font-size:18px;margin:8px 0 0}
.kjbig{font-family:var(--hand);font-size:30px;color:var(--blue)}
.team{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.slot{width:110px;min-height:128px;border:4px dashed #b8ad94;border-radius:18px;background:#fffaf0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#b8ad94;padding:4px}
.slot.on{border-style:solid;border-color:var(--ink);color:var(--ink);background:#fff3c4}
.slot svg{width:74px;height:74px}
.pick.chosen{outline:5px solid var(--blue);outline-offset:2px}
.btn:disabled{opacity:.4}
.hpbar{width:min(240px,30vw);height:22px;border:3px solid var(--ink);border-radius:12px;background:#eee;overflow:hidden;margin:0 auto}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8aa8,#e04a4a);transition:width .45s}
.hearts{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:120px}
.hearts i{width:14px;height:12px;display:block;background:radial-gradient(circle at 30% 35%,#ff8aa8 0 40%,#e04a4a 41%);border:2px solid var(--ink);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.hearts i.off{background:#ddd}
.hearts.big{max-width:200px}
.hearts.big i{width:22px;height:19px;border-width:3px}
.bench{display:flex;gap:6px}
.bench span{width:46px;height:46px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);display:block}
.bench span.on{background:var(--gold)}
.bench span.zz{opacity:.4;filter:grayscale(1)}
.bench svg{width:100%;height:100%;display:block}
.fighter.sleepy{filter:grayscale(1);opacity:.5;transform:rotate(-70deg) translateY(30px);transition:all .7s}
.fighter.pop svg{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.lungeL{animation:lungeL .5s ease-in-out}
@keyframes lungeL{40%{transform:translate(-60px,-12px) scale(1.08)}100%{transform:none}}
.mon.boss{width:min(260px,32vw)}
#ending{background:linear-gradient(#ffe9a8,#fff8e6);display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;overflow:auto}
.endart{width:min(260px,50vw)}
.endart svg{width:100%;height:auto}
.parade{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px;width:100%;max-width:980px}
.parade div{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;display:flex;flex-direction:column;align-items:center}
.parade svg{width:64px;height:64px}
.zhead{font-size:19px;font-weight:900;margin:16px 0 6px}
.zhead small{font-size:14px;color:var(--ink2)}
/* うまれる えんしゅつ */
.hatchbox{position:relative;width:min(420px,70vw,calc(100vh - 300px));aspect-ratio:1/1;margin:6px auto 0;overflow:visible}
.rays{position:absolute;inset:-35%;opacity:0;transform:scale(.3);pointer-events:none}
.rays svg{width:100%;height:100%}
.rays.on{animation:raysin .7s ease-out forwards,spin 9s linear infinite}
@keyframes raysin{to{opacity:.9;transform:scale(1)}}
@keyframes spin{from{rotate:0deg}to{rotate:360deg}}
.hatchchar{position:absolute;inset:6%;opacity:0;transform:scale(.1)}
.hatchchar svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 18px #fff6a0)}
.hatchchar.on{animation:charpop 1s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes charpop{0%{opacity:0;transform:scale(.1) translateY(30%)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
.hatchegg{position:absolute;inset:8% 16%}
.hatchegg svg{width:100%;height:100%}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0 40%,#fff8c8 70%,#ffe680);z-index:40;pointer-events:none;opacity:0}
.shard{position:absolute;left:50%;top:55%;width:44px;height:44px;pointer-events:none;z-index:3}
.shard svg{width:100%;height:100%}
.spark{position:absolute;left:50%;top:50%;font-size:30px;line-height:1;pointer-events:none;-webkit-text-stroke:2px #2a2a3a;z-index:4}
.confbox{position:absolute;inset:-10% -20%;pointer-events:none;overflow:hidden}
.confbox i{position:absolute;top:-10%;width:9px;height:14px;border-radius:2px;animation:fall2 2s ease-in forwards}
@keyframes fall2{to{transform:translateY(560px) rotate(540deg);opacity:0}}
.chip{position:absolute;width:12px;height:10px;border:2px solid #2a2a3a;border-radius:3px 1px 4px 1px;pointer-events:none;z-index:3}
.tip{pointer-events:auto;cursor:pointer}
.tip .spk{margin-right:6px}
.kjw{font-family:var(--hand);font-size:1.25em;color:var(--blue)}
.bgmbtn{background:none;border:2px solid rgba(255,255,255,.6);color:var(--paper);border-radius:12px;font-size:13px;font-weight:900;padding:3px 8px}
.hintbox ruby rt{font-size:.55em}
.hatchbox{z-index:0}
#egg>p,#egg>.row{position:relative;z-index:2}
#egg>p.say{text-shadow:0 0 6px #fff,0 0 12px #fff}
.shard{width:64px;height:64px}
</style>

<div id="app">
  <header class="bar">
    <h1>かんじぼうけん</h1>
    <span class="pill" title="とりもどした かんじ">なかま <span id="bornN">0</span>/80</span>
    <span class="pill" title="ほし">★ <span id="starN">0</span></span>
    <span class="sp"></span>
    <button class="navb" id="navField" type="button">ぼうけん</button>

var BG={name:null,timer:null,i:0,t:0};
function parseSeq(s){return s.split(/\s+/).map(function(x){return x==='.'?null:x==='-'?'-':midi(x);});}
function bgm(name){
  if(!actx){BG.want=name;return;}
  if(BG.name===name)return;BG.name=name;clearInterval(BG.timer);BG.timer=null;
  if(!name||!SONGS[name])return;var c=ac();if(!c)return;
  var sg=SONGS[name];if(!sg._a){sg._a=parseSeq(sg.a);sg._b=parseSeq(sg.b);}
  var e8=60/sg.bpm/2;BG.i=0;BG.t=c.currentTime+.08;
  BG.timer=setInterval(function(){
    if(!actx)return;
    while(BG.t<actx.currentTime+.25){
      var i=BG.i, a=sg._a[i%sg._a.length], b=sg._b[i%sg._b.length], dch=sg.d.charAt(i%sg.d.length);
      if(a&&a!=='-'){var len=1;while(sg._a[(i+len)%sg._a.length]==='-'&&len<8)len++;voiceNote(hz(a),sg.lead,e8*len*.95,.32,BG.t);if(sg.bell)tone(hz(a)*2,'sine',e8*len*.6,.06,null,BG.t,AU.bgm);}
      if(b&&b!=='-'){var lb=1;while(sg._b[(i+lb)%sg._b.length]==='-'&&lb<8)lb++;voiceNote(hz(b),'triangle',e8*lb*.9,.5,BG.t);}
      if(dch==='k')tone(110,'sine',.16,.6,45,BG.t,AU.bgm);
      if(dch==='s')noise(.12,.35,'bandpass',1800,BG.t,AU.bgm,.8);
      if(dch==='h')noise(.04,.18,'highpass',7000,BG.t,AU.bgm);
      if(dch==='t'){tone(90,'sine',.25,.8,55,BG.t,AU.bgm);noise(.08,.3,'lowpass',400,BG.t,AU.bgm);}
      BG.i++;BG.t+=e8;
    }
  },40);
}
function voiceNote(f,type,dur,vol,t){var c=actx;try{var o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*(type==='square'||type==='sawtooth'?.35:1),t+.015);g.gain.setValueAtTime(vol*(type==='square'||type==='sawtooth'?.28:.8),t+Math.max(.02,dur*.6));g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AU.bgm);o.start(t);o.stop(t+dur+.05);}catch(e){}}
function bgmVol(){if(!AU.bgm)return;var v=AU.bgmOn?(VO.playing?.05:.16):0;try{AU.bgm.gain.setTargetAtTime(v,actx.currentTime,.12);}catch(e){}}
function toggleBgm(){AU.bgmOn=!AU.bgmOn;try{localStorage.setItem('kanjiboken.bgm',AU.bgmOn?'1':'0');}catch(e){}bgmVol();$('bgmBtn').textContent=AU.bgmOn?'♪ オン':'♪ オフ';}

var VO={idx:window.VOICE_INDEX||{},packs:{},wait:{},buf:{},lru:[],playing:false,tok:0,src:null,missing:{}};
function splitS(t){t=String(t).replace(/[▶◀▲▼]/g,'').replace(/\s+/g,' ').trim();var out=[],cur='';
  for(var i=0;i<t.length;i++){var ch=t.charAt(i);cur+=ch;if('。！？!?'.indexOf(ch)>=0){var nx=t.charAt(i+1);if(nx==='」'||nx==='』'||'！？!?'.indexOf(nx)>=0)continue;if(cur.trim())out.push(cur.trim());cur='';}}
  if(cur.trim())out.push(cur.trim());return out;}
function vkey(who,s){return who+'|'+s;}
function loadPack(p){
  if(VO.packs[p])return Promise.resolve(VO.packs[p]);
  if(VO.wait[p])return VO.wait[p].pr;
  var w={};w.pr=new Promise(function(res){w.res=res;var sc=document.createElement('script');sc.src='voice/'+p+'.js';sc.onerror=function(){VO.packs[p]={};res({});};document.head.appendChild(sc);setTimeout(function(){if(!VO.packs[p]){res({});}},20000);});
  VO.wait[p]=w;return w.pr;
}
window.VOICE_PACK=function(p,data){VO.packs[p]=data;if(VO.wait[p])VO.wait[p].res(data);};
function b64buf(b){var s=atob(b),n=s.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function getBuf(k){
  var ref=VO.idx[k];if(!ref)return Promise.resolve(null);
  if(VO.buf[k])return Promise.resolve(VO.buf[k]);
  var c=ac();if(!c)return Promise.resolve(null);
  var pack=ref.split('/')[0],id=ref.split('/')[1];
  return loadPack(pack).then(function(d){var b=d[id];if(!b)return null;
    return new Promise(function(res){try{var pr=c.decodeAudioData(b64buf(b),function(ab){res(ab);},function(){res(null);});if(pr&&pr.then)pr.then(res,function(){res(null);});}catch(e){res(null);}});
  }).then(function(ab){if(ab){VO.buf[k]=ab;VO.lru.push(k);if(VO.lru.length>80){var o=VO.lru.shift();delete VO.buf[o];}}return ab;});
}
function prefetch(list){list.forEach(function(x){var r=VO.idx[x];if(r)loadPack(r.split('/')[0]);});}
function prefetchPacks(ps){ps.forEach(function(p){loadPack(p);});}
function stopVoice(){VO.tok++;if(VO.src){try{VO.src.onended=null;VO.src.stop();}catch(e){}VO.src=null;}try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}VO.playing=false;bgmVol();}
// say(ぶん, だれ) … ぶんを 「。！？」で くぎって、じゅんばんに ならす
function say(text,who){
  who=who||'narr';stopVoice();var tok=VO.tok,parts=splitS(plain(text));if(!parts.length)return Promise.resolve();
  return new Promise(function(done){
    var i=0;
    function next(){
      if(tok!==VO.tok){done();return;}
      if(i>=parts.length){VO.playing=false;bgmVol();done();return;}
      var s=parts[i++],k=vkey(who,s);
      getBuf(k).then(function(ab){
        if(tok!==VO.tok){done();return;}
        if(ab){var c=ac(),src=c.createBufferSource();src.buffer=ab;src.connect(AU.voice);VO.src=src;VO.playing=true;bgmVol();src.onended=function(){if(VO.src===src)VO.src=null;setTimeout(next,90);};src.start();}
        else{VO.missing[k]=1;if(window.__voiceMissing)window.__voiceMissing(k);fallbackSpeak(s,next);}
      });
    }
    next();
  });
}
function fallbackSpeak(s,next){try{if(!window.speechSynthesis){setTimeout(next,300);return;}var u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.95;u.pitch=1.1;VO.playing=true;bgmVol();u.onend=function(){next();};u.onerror=function(){next();};window.speechSynthesis.speak(u);}catch(e){setTimeout(next,300);}}

function walkable(m,x,y){var c=T(m,x,y);if(c==='X')return !!S.cleared[m];if(BLOCK.indexOf(c)>=0)return false;if(npcAt(m,x,y))return false;return true;}

function eggsLeft(m){return regKanji(m).filter(function(g){return !S.born[g];});}
function curEgg(m){if(m===0&&S.tut<1)return null;var k=regKanji(m);for(var i=0;i<k.length;i++)if(!S.born[k[i]])return {g:k[i],x:MAPS[m].eggs[i][0],y:MAPS[m].eggs[i][1],i:i};return null;}
function mobsLeft(m){var b=S.mb[m]||[];return MAPS[m].mobs.map(function(d,i){return i;}).filter(function(i){return b.indexOf(i)<0;});}
function mobsOn(m){return !(m===0&&S.tut<4);}
function bossActive(m){var b=MAPS[m].boss;if(!b)return null;
  if(b.final)return (bornCount()>=ORDER.length&&!S.ending)?b:null;
  if(S.cleared[m]||eggsLeft(m).length||mobsLeft(m).length)return null;return b;}
function frontier(){for(var i=0;i<8;i++)if(!S.cleared[i])return i;return 8;}

var hero={m:0,x:9,y:6,px:9,py:6}, moving=false, path=[], mobs=[], pending=null, talking=false, ring=null;

function spawnMobs(){
  mobs=[];var m=hero.m;if(!mobsOn(m))return;
  if(!S.cleared[m])mobsLeft(m).forEach(function(i){var d=MAPS[m].mobs[i];mobs.push({x:d.x,y:d.y,hx:d.x,hy:d.y,t:d.t,i:i,id:'mob'+i});});
  if((S.cleared[m]||!mobsLeft(m).length)&&MAPS[m].mobs.length)for(var j=0;j<2;j++){var d=MAPS[m].mobs[Math.floor(Math.random()*MAPS[m].mobs.length)],p=randFree(m);if(p)mobs.push({x:p[0],y:p[1],hx:p[0],hy:p[1],t:d.t,i:-1,id:'tmob'+j,train:true});}
}

// ---------- フィールドを かく ----------
function fitView(){var r=$('field').getBoundingClientRect();if(!r.width||!r.height)return;var a=r.width/r.height;VW=Math.min(MW*10,Math.max(100,100*a));VH=Math.max(100,Math.min(MH*10,VW/a));$('fieldSvg').setAttribute('viewBox','0 0 '+VW+' '+VH);}
function camTo(anim){cam.x=Math.max(0,Math.min(MW*10-VW,hero.x*10+5-VW/2));cam.y=Math.max(0,Math.min(MH*10-VH,hero.y*10+5-VH/2));
  var w=$('world');if(!w)return;if(!anim)w.classList.add('noanim');w.style.transform='translate('+(-cam.x)+'px,'+(-cam.y)+'px)';if(!anim){void w.getBoundingClientRect();w.classList.remove('noanim');}drawArrow();}

  mobs.forEach(function(mb){var g=el('g',{class:'mob',id:mb.id});g.style.transform='translate('+(mb.x*10)+'px,'+(mb.y*10)+'px)';var inner=el('g',{transform:'translate(1,1.6) scale(.05)'});inner.innerHTML='<g class="mobbob">'+mobSVG(mb.t)+'</g>';g.appendChild(inner);world.appendChild(g);});
  var rg=el('g',{id:'ringG'});world.appendChild(rg);

}
function drawRing(){var g=$('ringG');if(!g)return;clear(g);if(!ring||ring.m!==hero.m)return;var c=el('circle',{cx:ring.x*10+5,cy:ring.y*10+5,r:6.5,fill:'none',stroke:'#ffd23f','stroke-width':1.6});c.setAttribute('class','pulse');g.appendChild(c);var a=el('path',{d:'M'+(ring.x*10+5)+','+(ring.y*10-1)+' l-2.4,-3 h4.8 Z',fill:'#ff7a59',stroke:'#2a2a3a','stroke-width':.4});a.setAttribute('class','bounce');g.appendChild(a);}
// めあて（つぎに することと その ばしょ）
function objective(){
  var m=hero.m,f=frontier();
  if(S.ending)return {t:'まおうを たおした！ すきな ところを ぼうけんしよう'};
  if(m<f){var ex=findTile(m,'>');return {t:'みぎの みちから つぎの くにへ すすもう ▶',x:ex[0],y:ex[1]};}
  if(m===0&&S.tut<1)return {t:''};
  var e=curEgg(m);if(e)return {t:(S.egg[e.g]?'とちゅうの たまご。あと '+(EGG_GOAL-S.egg[e.g])+'かい！':'たまごを さがそう！')+' さわると ひらくよ',x:e.x,y:e.y};
  var live=mobs.filter(function(q){return !q.train;});
  if(live.length){var best=live[0],bd=1e9;live.forEach(function(q){var d=Math.abs(q.x-hero.x)+Math.abs(q.y-hero.y);if(d<bd){bd=d;best=q;}});return {t:'てきを ぜんぶ やっつけよう！ のこり '+live.length,x:best.x,y:best.y};}
  if(!mobsOn(m))return {t:''};
  var b=bossActive(m);if(b)return {t:'ボス「'+b.name+'」に さわって たたかおう！',x:b.x,y:b.y};

function findTile(m,ch){for(var y=0;y<MH;y++){var i=MAPS[m].tiles[y].indexOf(ch);if(i>=0)return [i,y];}return [0,0];}
function updateTip(){
  var o=objective();$('tip').innerHTML=o.t?'<span class="spk">🔊</span>'+esc(o.t):'';$('tip').dataset.t=o.t;$('tip').hidden=!o.t||talking;

    p.innerHTML=S.cleared[m]?'<b>クリア！</b>':'たまご <b>'+eb+'/'+k.length+'</b>　てき <b>'+mb+'/'+MAPS[m].mobs.length+'</b>'+(bossActive(m)?'　<b class="bossmark">ボス！</b>':'');p.hidden=false;}

function drawArrow(){
  var g=$('uiG');if(!g)return;clear(g);var o=objective();if(o.x==null||talking)return;
  var tx=o.x*10+5-cam.x,ty=o.y*10+5-cam.y;if(tx>4&&tx<VW-4&&ty>4&&ty<VH-4)return;
  var cx=VW/2,cy=VH/2,dx=tx-cx,dy=ty-cy,L=Math.sqrt(dx*dx+dy*dy)||1;dx/=L;dy/=L;
  var k=Math.min((VW/2-9)/Math.abs(dx||1e-6),(VH/2-9)/Math.abs(dy||1e-6)),ax=cx+dx*k,ay=cy+dy*k,ang=Math.atan2(dy,dx)*180/Math.PI;
  var a=el('g',{transform:'translate('+ax+','+ay+') rotate('+ang+')'});a.appendChild(el('circle',{r:6,fill:'#fffaf0',stroke:'#2a2a3a','stroke-width':.8}));a.appendChild(el('path',{d:'M-2.6,-3 L3.4,0 L-2.6,3 Z',fill:'#ff7a59'}));a.setAttribute('class','arrowui');g.appendChild(a);
}

// ---------- あるく ----------
function bfs(m,sx,sy,tx,ty,trig){
  var ok=function(x,y){return walkable(m,x,y)||(trig&&x===tx&&y===ty);};
  if(!ok(tx,ty))return null;var key=function(x,y){return x+','+y;};var prev={},q=[[sx,sy]];prev[key(sx,sy)]=null;
  while(q.length){var c=q.shift();if(c[0]===tx&&c[1]===ty)break;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=c[0]+d[0],ny=c[1]+d[1];if(nx<0||ny<0||nx>=MW||ny>=MH)return;var k=key(nx,ny);if(k in prev||!ok(nx,ny))return;prev[k]=c;q.push([nx,ny]);});}
  if(!(key(tx,ty) in prev))return null;var p=[],c=[tx,ty];while(c&&!(c[0]===sx&&c[1]===sy)){p.unshift(c);c=prev[key(c[0],c[1])];}return p;
}
function walkTo(tx,ty){var p=bfs(hero.m,hero.x,hero.y,tx,ty);if(!p)return false;path=p;if(!moving)stepAlong();return true;}
function stepAlong(){
  if(cur!=='field'||talking){path=[];moving=false;return;}
  if(!path.length){moving=false;if(pending){var n=pending;pending=null;if(Math.abs(n.x-hero.x)+Math.abs(n.y-hero.y)===1)interact(n);}return;}
  moving=true;var n=path.shift();if(!moveHero(n[0],n[1])){path=[];moving=false;pending=null;return;}setTimeout(stepAlong,170);
}
function adjTarget(tx,ty){var best=null,bl=1e9;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var x=tx+d[0],y=ty+d[1];if(x===hero.x&&y===hero.y){best=[];bl=0;return;}var p=bfs(hero.m,hero.x,hero.y,x,y);if(p&&p.length<bl){bl=p.length;best=p;}});return best;}
function onTap(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH)return;
  var n=npcAt(hero.m,tx,ty)||signAt(hero.m,tx,ty);
  if(n){var p=adjTarget(tx,ty);if(!p)return;if(!p.length){interact(n);return;}pending=n;path=p;if(!moving)stepAlong();return;}
  if(tx===hero.x&&ty===hero.y){arrive(true);return;}
  walkTo(tx,ty);
}
// 1マス すすむ。イベントが おきたら false
function moveHero(x,y){
  hero.px=hero.x;hero.py=hero.y;hero.x=x;hero.y=y;step();
  var h=$('hero');if(h)h.style.transform='translate('+(x*10)+'px,'+(y*10)+'px)';
  S.map=hero.m;S.pos=[x,y];camTo(true);
  if(ring&&ring.m===hero.m&&ring.x===x&&ring.y===y&&!ring.npc){ring=null;drawRing();}
  var c=T(hero.m,x,y);
  if(c==='>'&&hero.m<MAPS.length-1){goMap(hero.m+1,'<');return false;}
  if(c==='<'&&hero.m>0){goMap(hero.m-1,'>');return false;}
  save();
  return arrive(false);
}
function arrive(tapSelf){
  var x=hero.x,y=hero.y,e=curEgg(hero.m);
  if(e&&e.x===x&&e.y===y){path=[];setTimeout(function(){openEgg(e);},180);return false;}
  var b=bossActive(hero.m);
  if(b&&b.x===x&&b.y===y){path=[];setTimeout(function(){bossEncounter(hero.m);},180);return false;}
  if(!tapSelf&&checkMob())return false;
  updateTip();return true;
}
function stepBack(){hero.x=hero.px;hero.y=hero.py;S.pos=[hero.x,hero.y];save();}
function goMap(m,from){
  path=[];pending=null;var p=findTile(m,from);hero.m=m;hero.x=p[0]+(from==='<'?1:-1);hero.y=p[1];hero.px=hero.x;hero.py=hero.y;
  S.map=m;S.pos=[hero.x,hero.y];save();spawnMobs();sfx('warp');
  var f=$('field');f.classList.remove('fadein');void f.offsetWidth;f.classList.add('fadein');
  drawField();setTimeout(hooks,450);
}
function checkMob(){for(var i=0;i<mobs.length;i++){var mb=mobs[i];if(mb.x===hero.x&&mb.y===hero.y){path=[];pending=null;var it=mb;setTimeout(function(){startMob(it);},150);return true;}}return false;}
function moveMobs(){
  if(cur!=='field'||talking)return;var e=curEgg(hero.m),b=bossActive(hero.m);
  mobs.forEach(function(mb){if(Math.random()<.35)return;var d=shuffle([[1,0],[-1,0],[0,1],[0,-1]])[0];var nx=mb.x+d[0],ny=mb.y+d[1],c=T(hero.m,nx,ny);
    if(Math.abs(nx-mb.hx)>3||Math.abs(ny-mb.hy)>3)return;
    if(walkable(hero.m,nx,ny)&&c!=='>'&&c!=='<'&&c!=='X'&&!(e&&e.x===nx&&e.y===ny)&&!(b&&b.x===nx&&b.y===ny)&&!mobs.some(function(o){return o!==mb&&o.x===nx&&o.y===ny;})){mb.x=nx;mb.y=ny;var g=$(mb.id);if(g)g.style.transform='translate('+(nx*10)+'px,'+(ny*10)+'px)';}});
  if(!moving&&checkMob())return;
  drawArrow();
}
function toWorld(ev){var w=$('world'),pt=$('fieldSvg').createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(w.getScreenCTM().inverse());}
$('fieldSvg').addEventListener('click',function(ev){ac();if(talking){nextTalk();return;}var p=toWorld(ev);onTap(Math.floor(p.x/10),Math.floor(p.y/10));});
function nudge(dx,dy){ac();if(talking){nextTalk();return;}if(moving)return;var nx=hero.x+dx,ny=hero.y+dy;var n=npcAt(hero.m,nx,ny)||signAt(hero.m,nx,ny);if(n){interact(n);return;}
  var e=curEgg(hero.m),b=bossActive(hero.m);if(walkable(hero.m,nx,ny)||(b&&b.x===nx&&b.y===ny))moveHero(nx,ny);}
document.querySelectorAll('.dpad button').forEach(function(b){var d=b.getAttribute('data-d').split(',').map(Number);b.addEventListener('click',function(ev){ev.stopPropagation();nudge(d[0],d[1]);});});
document.addEventListener('keydown',function(e){if(cur!=='field')return;var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();nudge(m[0],m[1]);}else if((e.key==='Enter'||e.key===' ')&&talking){e.preventDefault();nextTalk();}});
window.addEventListener('resize',function(){if(cur==='field'){fitView();camTo(false);}});

var TQ=null;
function talk(lines,done){sfx('talk');talking=true;$('field').classList.add('talking');path=[];pending=null;TQ={l:lines,i:0,done:done};$('tip').hidden=true;drawArrow();showLine();}

function bubble(n,t){var g=$('fxG');if(!g)return;var b=el('g',{transform:'translate('+(n.x*10+5)+','+(n.y*10-2)+')'});b.innerHTML='<rect x="-9" y="-6" width="18" height="6.4" rx="3" fill="#fff" stroke="#2a2a3a" stroke-width=".5"/><text y="-1.4" text-anchor="middle" font-size="3.6" font-weight="900" fill="#2a2a3a" font-family="Zen Maru Gothic,sans-serif">'+esc(t)+'</text><path d="M-1,0.3 L0,2 L1,0.3" fill="#fff" stroke="#2a2a3a" stroke-width=".4"/>';b.setAttribute('class','pop');g.appendChild(b);setTimeout(function(){b.remove();},1400);}
function interact(n){
  if(n.sign){talk([{who:'sign',name:'かんばん',text:n.text}]);return;}
  if(isAnimal(n.k)){var a=ANIMAL[n.k];bubble(n,a.say);tone(a.hz[0],'triangle',.18,.18,a.hz[1]);setTimeout(function(){tone(a.hz[1],'triangle',.18,.15,a.hz[0]);},200);say(a.say,'anim');return;}
  var lines=(S.cleared[hero.m]&&n.a)?n.a:n.l;

    if(ring&&ring.npc&&ring.m===hero.m&&ring.x===n.x&&ring.y===n.y){ring=null;drawRing();}

var ENDWORD={tome:'ピタッ',hane:'ピョン',harai:'スーッ'};
function taperStart(poly){var n=poly.length,e=poly[n-1],b=poly[n-2];var total=0;for(var i=1;i<n;i++)total+=dist(poly[i],poly[i-1]);var back=Math.min(total*0.4,dist(e,b)-2);var dx=e[0]-b[0],dy=e[1]-b[1],L0=Math.sqrt(dx*dx+dy*dy)||1;return [e[0]-dx/L0*back,e[1]-dy/L0*back];}
function endMarker(poly,kind,color,w){var n=poly.length,e=poly[n-1],b=poly[n-2],dx=e[0]-b[0],dy=e[1]-b[1],L0=Math.sqrt(dx*dx+dy*dy)||1;dx/=L0;dy/=L0;var qx=-dy,qy=dx,hw=(w||10)/2;
  if(kind==='tome')return el('circle',{cx:e[0],cy:e[1],r:hw+1,fill:color});
  var hx=e[0]+dx*6,hy=e[1]+dy*6;return el('polygon',{points:(b[0]+qx*hw*0.9)+','+(b[1]+qy*hw*0.9)+' '+(b[0]-qx*hw*0.9)+','+(b[1]-qy*hw*0.9)+' '+hx+','+hy,fill:color});}
function haraiShape(poly,w,extra){var n=poly.length,e=poly[n-1],b=poly[n-2],dx=e[0]-b[0],dy=e[1]-b[1],L0=Math.sqrt(dx*dx+dy*dy)||1;dx/=L0;dy/=L0;
  var ext=poly.slice(0,n-1).concat([[e[0]+dx*extra,e[1]+dy*extra]]);var pts=resample(ext,1.5),total=0,cum=[0];
  for(var i=1;i<pts.length;i++){total+=dist(pts[i],pts[i-1]);cum.push(total);}
  var tf=total*0.55,left=[],right=[];
  for(var j=0;j<pts.length;j++){var p=pts[j],a=pts[Math.max(0,j-1)],c=pts[Math.min(pts.length-1,j+1)];var tx=c[0]-a[0],ty=c[1]-a[1],tl=Math.sqrt(tx*tx+ty*ty)||1;tx/=tl;ty/=tl;var s=cum[j]<=tf?0:(cum[j]-tf)/(total-tf);var hw=(w/2)*Math.pow(1-s,1.7);left.push([p[0]-ty*hw,p[1]+tx*hw]);right.push([p[0]+ty*hw,p[1]-tx*hw]);}
  var d='M'+left[0][0].toFixed(1)+','+left[0][1].toFixed(1);for(var k=1;k<left.length;k++)d+=' L'+left[k][0].toFixed(1)+','+left[k][1].toFixed(1);for(var m=right.length-1;m>=0;m--)d+=' L'+right[m][0].toFixed(1)+','+right[m][1].toFixed(1);return d+' Z';}

/* tracer(stageDiv, 字, おてほん 'full'|'faint'|'dot', コールバック) → 1回書き終わるたびに onWrite */
function tracer(stage,g,guideMode,cb){
  var k=K[g]; stage.innerHTML='';
  var svg=el('svg',{viewBox:'0 0 160 160'});
  var grid=el('g',{stroke:'#e6dcc6','stroke-width':1,'stroke-dasharray':'3 4'});grid.appendChild(el('line',{x1:80,y1:6,x2:80,y2:154}));grid.appendChild(el('line',{x1:6,y1:80,x2:154,y2:80}));svg.appendChild(grid);
  var guides=el('g',{}),done=el('g',{}),live=el('g',{});svg.appendChild(guides);svg.appendChild(done);svg.appendChild(live);stage.appendChild(svg);
  var T={si:0,samples:[],target:0,drawing:false,pts:[],pt:'touch',miss:0,mode:guideMode,help:false};
  function tol(){return T.pt==='pen'?22:30;}
  function drawGuides(){
    clear(guides);

      if(i<T.si)return;var curS=i===T.si;
      var op=(T.mode==='full'||T.help)?(curS?1:.5):T.mode==='faint'?(curS?.22:.08):0;
      if(op>0)guides.appendChild(strokeEl(s,k.e[i],curS?'#8fb3d9':'#d9d2c0',curS?12:10,op));

    });
    if(T.si<k.s.length){var s0=k.s[T.si][0];var c=el('circle',{cx:s0[0],cy:s0[1],r:8,fill:'#ff7a59'});c.setAttribute('class','pulse');guides.appendChild(c);}
  }
  function start(){T.samples=resample(k.s[T.si],4);T.target=0;T.miss=0;T.help=false;drawGuides();}
  function finish(){
    var kind=k.e[T.si],s=k.s[T.si];
    done.appendChild(strokeEl(s,kind,'#2a2a3a',11,1));done.appendChild(strokeEl(s,kind,'#3b6fd9',6,1));
    endSound(kind);T.si++;
    if(T.si>=k.s.length){clear(guides);cb.onWrite&&cb.onWrite();}

    T.drawing=true;T.pts=[p];T.target=0;try{svg.setPointerCapture(ev.pointerId);}catch(e){}
    clear(live);live.appendChild(el('path',{d:pathD(T.pts),fill:'none',stroke:'#3b6fd9','stroke-width':8,'stroke-linecap':'round','stroke-linejoin':'round',opacity:.85}));
  });

    if(!T.drawing)return;ev.preventDefault();var p=pos(ev);T.pts.push(p);
    var lp=live.firstChild;if(lp){lp.setAttribute('d',pathD(T.pts));if(ev.pressure&&T.pt==='pen')lp.setAttribute('stroke-width',(5+ev.pressure*8).toFixed(1));}

  });
  function up(){
    if(!T.drawing)return;T.drawing=false;
    var okEnd=dist(T.pts[T.pts.length-1],T.samples[T.samples.length-1])<tol()*1.3;
    if(T.target>=T.samples.length*0.8&&okEnd){clear(live);finish();}
    else{T.miss++;S.miss[g]=(S.miss[g]||0)+1;save();var lp=live.firstChild;if(lp){lp.setAttribute('opacity','.3');setTimeout(function(){clear(live);},450);}
      if(T.miss>=2&&T.mode!=='full'){T.help=true;drawGuides();cb.onHint&&cb.onHint('おてほんが ひかったよ。いっしょに なぞろう');}
      else cb.onHint&&cb.onHint('もういっかい！');}
  }

          toggle:function(){T.help=!T.help;drawGuides();}};
}

function absorbStars(box,from,to,g,done){
  var br=box.getBoundingClientRect(),a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
  var ax=a.left-br.left+a.width/2+box.scrollLeft, ay=a.top-br.top+a.height/2+box.scrollTop;
  var bx=b.left-br.left+b.width/2+box.scrollLeft, by=b.top-br.top+b.height/2+box.scrollTop;
  var big=document.createElement('div');big.className='bigstar';big.textContent='★';big.style.left=ax+'px';big.style.top=ay+'px';box.appendChild(big);
  tone(1568,'sine',.5,.18);setTimeout(function(){tone(2093,'sine',.6,.16);},180);
  var bigAnim=big.animate([{transform:'translate(-50%,-50%) scale(.2) rotate(0deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1.5) rotate(180deg)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) scale(1.2) rotate(360deg)',opacity:1}],{duration:900,easing:'ease-out',fill:'forwards'});
  bigAnim.onfinish=function(){
    var n=7,left=n;
    for(var i=0;i<n;i++)(function(i){
      var s=document.createElement('div');s.className='flystar';s.textContent='★';s.style.left=ax+'px';s.style.top=ay+'px';box.appendChild(s);
      var mx=(ax+bx)/2+(i-3)*28, my=Math.min(ay,by)-90-Math.abs(i-3)*12;
      var an=s.animate([{transform:'translate(-50%,-50%) scale(1)',left:ax+'px',top:ay+'px'},{left:mx+'px',top:my+'px',transform:'translate(-50%,-50%) scale(1.2)',offset:.45},{left:bx+'px',top:by+'px',transform:'translate(-50%,-50%) scale(.3)',opacity:.6}],{duration:900,delay:i*90,easing:'ease-in',fill:'forwards'});
      an.onfinish=function(){s.remove();tone(1200+i*120,'triangle',.12,.12);left--;if(!left)finish();};
    })(i);
    big.animate([{opacity:1},{opacity:0,transform:'translate(-50%,-50%) scale(.2)'}],{duration:500,fill:'forwards'}).onfinish=function(){big.remove();};
  };
  function finish(){
    S.lv=S.lv||{};S.lv[g]=lvOf(g)+1;S.stars++;save();hud();
    to.classList.remove('levelup');void to.offsetWidth;to.classList.add('levelup');

    beep([784,988,1175,1568]);setTimeout(function(){lb.remove();},2200);
    done(S.lv[g]);
  }
}
