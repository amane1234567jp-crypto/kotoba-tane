ton data-s="pre_x1_shima_d.mp3">やったー！ いえたよ！</button></div></section>
<script>let a=new Audio();const play=s=>new Promise(r=>{a.pause();a=new Audio(s);a.onended=r;a.onerror=r;a.play().catch(r)});
document.querySelectorAll("button[data-s]").forEach(b=>b.onclick=()=>play(b.dataset.s));
