name: aivis
on:
  push:
    branches: [main]
    paths: ["tools/aivis/**", ".github/workflows/aivis.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p /tmp/out
          bash tools/aivis/run.sh 2>&1 | tee /tmp/out/log.txt || true
      - name: publish results to aivis-out branch
        if: always()
        run: |
          git config user.name "aivis-bot"; git config user.email "aivis-bot@users.noreply.github.com"
          git checkout --orphan aivis-out-tmp
          git rm -rf -q . ; rm -rf ./*
          cp -r /tmp/out/. .
          git add -A; git commit -q -m "aivis run ${GITHUB_SHA}"
          git push -f origin HEAD:aivis-out
