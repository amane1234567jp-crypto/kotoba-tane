# まるシマリバーシ アプリ版（Android）のテスト用 APK を作る
# reversi/ か このファイルを main に push すると動く。できた APK は reversi-app-out ブランチに置く
#   → https://amane1234567jp-crypto.github.io/kotoba-tane/ とは別。ダウンロード用の URL は run の最後に出す
# ストアに出す本番ビルドは EAS（別の鍵）で行う。ここの鍵は keys/test.keystore（テスト専用）
name: reversi-app-android
on:
  push:
    branches: [main]
    paths: ["reversi/**", "!reversi/KIROKU.md", ".github/workflows/reversi-app-android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reversi-app-android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run: { working-directory: reversi/app }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: install
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -5
          npx expo install --fix 2>&1 | tail -5 || true
          npm ls --depth=0 2>/dev/null | head -30
      - name: pack web
        run: npm run pack-web
      - name: prebuild
        run: |
          npx expo prebuild --platform android --no-install --clean 2>&1 | tail -20
          # テスト用の鍵で 署名して release を作る
          python3 - <<'PY'
          import re
          p="android/app/build.gradle"; s=open(p).read()
          s=s.replace("signingConfigs {", """signingConfigs {
                  release {
                      storeFile file('../../keys/test.keystore')
                      storePassword 'marushima-test'
                      keyAlias 'test'
                      keyPassword 'marushima-test'
                  }""",1)
          i=s.index("        release {", s.index("buildTypes {"))
          s=s[:i]+s[i:].replace("signingConfig signingConfigs.debug","signingConfig signingConfigs.release",1)
          open(p,"w").write(s)
          print("release signing:", "signingConfig signingConfigs.release" in s)
          PY
      - name: gradle wrapper
        run: |
          # Gradle 本体の取得。GitHub の配布が 504 を返すことがあるので、何度か待ってだめなら ミラーに切り替える
          cd android && chmod +x gradlew
          ok=0
          for i in 1 2 3 4; do ./gradlew --version -q >/dev/null 2>&1 && ok=1 && break; echo "gradle 取得 失敗 $i 回目"; sleep 45; done
          if [ $ok = 0 ]; then
            V=$(grep -o 'gradle-[0-9.]*-bin.zip' gradle/wrapper/gradle-wrapper.properties | head -1)
            sed -i "s#^distributionUrl=.*#distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/$V#" gradle/wrapper/gradle-wrapper.properties
            grep distributionUrl gradle/wrapper/gradle-wrapper.properties
            ./gradlew --version -q
          fi
      - name: gradle
        run: |
          cd android && ./gradlew assembleRelease --no-daemon -q 2>&1 | tail -40
          ls -la app/build/outputs/apk/release/
      - name: publish
        if: success()
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          mkdir -p /tmp/out && cp "$APK" /tmp/out/marushima-reversi.apk
          echo "{\"sha\":\"${GITHUB_SHA}\",\"at\":\"$(date -u +%FT%TZ)\",\"size\":$(stat -c %s "$APK")}" > /tmp/out/latest.json
          cd "$GITHUB_WORKSPACE"
          git config user.name "app-bot"; git config user.email "app-bot@users.noreply.github.com"
          git checkout --orphan app-tmp
          git rm -rf -q . ; rm -rf ./* ./.github
          cp -r /tmp/out/. .
          git add -A; git commit -q -m "reversi app apk ${GITHUB_SHA}"
          git push -f origin HEAD:reversi-app-out
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/raw/reversi-app-out/marushima-reversi.apk"
