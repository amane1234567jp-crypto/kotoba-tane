name: reversi-app-eas
# まるシマリバーシ アプリ版の ストア向けビルド（EAS）。ことばのたね の app.yml と同じ仕組み。
# reversi/app/BUILD に「ios production no」などを書いて push すると動く。結果は reversi-eas-out ブランチへ。
# 鍵は ことばのたね と共通（EXPO_TOKEN・ASC_API_KEY_P8）。テスト配布用の APK は reversi-app-android.yml（GitHub 上で作る）
on:
  push:
    branches: [main]
    paths: ["reversi/app/BUILD"]
  workflow_dispatch:
    inputs:
      platform: { description: "android / ios", default: "ios" }
      profile: { description: "preview / production", default: "production" }
      submit: { description: "ストアへ送る（production のみ）", default: "no" }
permissions:
  contents: write
concurrency:
  group: reversi-app-eas
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: settings
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then P="${{ inputs.platform }}"; F="${{ inputs.profile }}"; S="${{ inputs.submit }}";
          else read P F S REST < <(sed 's/#.*//' reversi/app/BUILD) || true; fi
          echo "platform=${P:-ios}" >> $GITHUB_OUTPUT; echo "profile=${F:-production}" >> $GITHUB_OUTPUT; echo "submit=${S:-no}" >> $GITHUB_OUTPUT
          echo "platform=${P:-ios} profile=${F:-production} submit=${S:-no}"
      - name: prepare
        env:
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          cd reversi/app && npm ci --no-audit --no-fund 2>&1 | tail -2 && npm run pack-web
          mkdir -p /tmp/out /tmp/b && rsync -a --exclude .git --exclude android --exclude ios ./ /tmp/b/
          printf '%s\n' "$ASC_P8" | tr -d '\r' | sed 's/^[ \t]*//;s/[ \t]*$//' | sed '/^$/d' > /tmp/b/asc.p8
          echo "p8: $(wc -l < /tmp/b/asc.p8) lines / begin=$(head -1 /tmp/b/asc.p8 | grep -c 'BEGIN PRIVATE KEY') / end=$(tail -1 /tmp/b/asc.p8 | grep -c 'END PRIVATE KEY')" | tee /tmp/out/p8check.txt
          if ! head -1 /tmp/b/asc.p8 | grep -q BEGIN; then B=$(tr -d ' \n' < /tmp/b/asc.p8); printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(echo "$B" | fold -w 64)" > /tmp/b/asc.p8; echo "p8: header added" | tee -a /tmp/out/p8check.txt; fi
      - name: eas project
        run: |
          cd /tmp/b
          # 設定が読めるか先に確かめる（だめなら ここで理由が出る）
          npx expo config --json > /tmp/out/config.json 2> /tmp/out/config_err.txt || { echo "expo config 失敗:"; cat /tmp/out/config_err.txt; }
          { echo "--- in /tmp/b"; node --version; ls -la node_modules/.bin/expo; node node_modules/expo/bin/cli config --json 2>&1 | head -c 600; echo "exit=${PIPESTATUS[0]}";
            echo "--- in repo dir"; cd $GITHUB_WORKSPACE/reversi/app && node node_modules/expo/bin/cli config --json 2>&1 | head -c 300; echo "exit=${PIPESTATUS[0]}";
            echo "--- debug"; cd /tmp/b && EXPO_DEBUG=1 DEBUG='expo:*' node node_modules/expo/bin/cli config --json 2>&1 | tail -40; } > /tmp/out/diag.txt 2>&1 || true
          cat /tmp/out/diag.txt
          if ! grep -q projectId app.json; then npx eas-cli init --non-interactive --force 2>&1 | tee /tmp/out/init.txt; cp app.json $GITHUB_WORKSPACE/reversi/app/app.json; fi
          grep -o '"projectId": *"[^"]*"' app.json | tee /tmp/out/projectId.txt
      - name: build
        env:
          EXPO_ASC_API_KEY_PATH: /tmp/b/asc.p8
          EXPO_ASC_KEY_ID: MKX36V742D
          EXPO_ASC_ISSUER_ID: 2fa8da34-49c0-4c52-aae7-77f748a041f7
          EXPO_APPLE_TEAM_ID: ZGYPGQ9WPN
          EXPO_APPLE_TEAM_TYPE: COMPANY_OR_ORGANIZATION
        run: |
          cd /tmp/b
          EXTRA=""; if [ "${{ steps.s.outputs.submit }}" = "yes" ]; then EXTRA="--auto-submit"; fi
          export EAS_BUILD_NO_EXPO_GO_WARNING=true
          if [ "${{ steps.s.outputs.platform }}" = "ios" ]; then
            # iOS は はじめてのとき 証明書・プロファイルを作る質問が出るので、画面つきで動かして すべて Enter で答える
            (for i in $(seq 1 200); do echo; sleep 4; done) | timeout 150m env -u CI -u GITHUB_ACTIONS script -qefc "npx eas-cli build -p ios --profile ${{ steps.s.outputs.profile }} $EXTRA" /tmp/out/log.txt > /dev/null || echo "FAILED" >> /tmp/out/log.txt
            timeout 5m npx eas-cli build:list -p ios --limit 1 --json --non-interactive > /tmp/out/build.json < /dev/null || true
          else
            npx eas-cli build -p ${{ steps.s.outputs.platform }} --profile ${{ steps.s.outputs.profile }} --non-interactive --wait --json $EXTRA > /tmp/out/build.json 2> >(tee /tmp/out/log.txt >&2) || echo "FAILED" >> /tmp/out/log.txt
          fi
          cat /tmp/out/build.json || true
          sed -i 's/\x1b\[[0-9;?]*[A-Za-z]//g' /tmp/out/log.txt || true
      - name: publish
        if: always()
        run: |
          git config user.name "app-bot"; git config user.email "app-bot@users.noreply.github.com"
          if ! git diff --quiet reversi/app/app.json; then git add reversi/app/app.json; git commit -q -m "まるシマリバーシ アプリ：EAS の プロジェクト ID"; git pull -q --rebase && git push -q; fi
          cp -r /tmp/out /tmp/res; git checkout -q --orphan rv-eas-tmp; git rm -rf -q . ; rm -rf ./* ./.github
          cp -r /tmp/res/. .; git add -A; git commit -q -m "reversi app eas ${GITHUB_SHA}"; git push -f -q origin HEAD:reversi-eas-out
