<title>ことばのたね なかま動作見本</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* layout: stage on top; friend picker chips, then action buttons, then sliders */
:root {
  --bg: #FFF8E1; --surface: #FFFFFF; --ink: #2B2A33; --muted: #5E5A6B; --line: #2B2A33;
  --accent: #FFD25E; --soft: #FFEFB8; --focus: #2F79F7;
  --display: "Mochiy Pop One", "Zen Maru Gothic", system-ui, sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1F1D26; --surface: #2B2935; --ink: #F4F1FA; --muted: #BDB8CC; --line: #6B667D; --soft: #4A4536; --focus: #8DB4FF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1F1D26; --surface: #2B2935; --ink: #F4F1FA; --muted: #BDB8CC; --line: #6B667D; --soft: #4A4536; --focus: #8DB4FF; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6 }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: grid; gap: 14px }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 34px); margin: 0 }
.lead { color: var(--muted); margin: 4px 0 0; max-width: 68ch }
.stage { width: 100%; aspect-ratio: 16 / 10; max-width: 100%; border: 4px solid #2B2A33; border-radius: 22px; overflow: hidden; background: #BDE3F2 }
.stage svg { display: block; width: 100%; height: 100% }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.row .lab { font-weight: 700; color: var(--muted); margin-right: 4px; font-size: 14px }
button { font: 700 16px var(--body); min-height: 46px; padding: 6px 16px; border-radius: 999px; border: 3px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
button.primary { background: var(--accent); color: #2B2A33; border-color: #2B2A33 }
button[aria-pressed="true"] { background: var(--soft) }
.chip[aria-pressed="true"] { background: var(--accent); color: #2B2A33; border-color: #2B2A33 }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }
.sliders { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; color: var(--muted); font-weight: 700 }
.sliders label { display: flex; align-items: center; gap: 10px }
.sliders input[type=range] { width: min(240px, 60vw); accent-color: #E8735A }
.moves { display: grid; gap: 8px }
.moves .row button { min-height: 42px; padding: 4px 14px; font-size: 15px }
.note { color: var(--muted); font-size: 14px; max-width: 72ch; margin: 0 }
</style>
<div class="wrap">
  <header>
    <h1>ことばのたね なかま動作見本</h1>
    <p class="lead">10体を同じ仕組みで動かしています。動きは30種類あり、よろこぶ・きもち・あいさつ・ようす・ちんじ・ふたりで に分けています。しばらく何もしないと、キャラが自分から小さく動きます。</p>
  </header>
  <div class="stage"><svg id="scene" viewBox="0 0 1600 1000" role="img" aria-label="校舎の前に、選んだ仲間とまるシマが立っている"></svg></div>
  <div class="row" role="group" aria-label="見かた">
    <span class="lab">見かた</span>
    <button class="mode" id="m-solo" type="button" aria-pressed="true">ひとりずつ</button>
    <button class="mode" id="m-all" type="button" aria-pressed="false">みんな あつまれ</button>
  </div>
  <div class="row" role="group" aria-label="仲間をえらぶ" id="chips"><span class="lab">なかま</span></div>
  <div class="row" role="group" aria-label="しゃべる・おまかせ">
    <span class="lab">うごき</span>
    <button class="primary" id="b-talk" type="button">しゃべる</button>
    <button class="primary" id="b-random" type="button">おまかせ</button>
    <button id="b-walk" type="button" aria-pressed="false">あるく</button>
    <button id="b-idle" type="button" aria-pressed="true">ひまなときも うごく</button>
  </div>
  <div id="moves" class="moves"></div>
  <div class="sliders">
    <label for="tod">あさ <input id="tod" type="range" min="0" max="100" value="25"> ゆうがた</label>
    <label for="motion">うごきの つよさ <input id="motion" type="range" min="0" max="100" value="100"></label>
  </div>
  <p class="note">音声：VOICEVOX:四国めたん、VOICEVOX:猫使アル、VOICEVOX:玄野武宏、VOICEVOX:麒ヶ島宗麟、VOICEVOX:剣崎雌雄、VOICEVOX:白上虎太郎、VOICEVOX:満別花丸、VOICEVOX:九州そら、VOICEVOX:ちび式じい、VOICEVOX:東北イタコ　／　効果音はその場で合成しています。</p>
</div>

const NS = "http://www.w3.org/2000/svg";
const INK = "#2B2A33";
const svg = document.getElementById("scene");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let motion = reduce ? 0.3 : 1;
/* ---------- 小さな道具 ---------- */
class Spring {
  constructor(v = 0, k = 170, d = 13) { this.v = v; this.t = v; this.vel = 0; this.k = k; this.d = d; }
  step(dt) { const f = -this.k * (this.v - this.t) - this.d * this.vel; this.vel += f * dt; this.v += this.vel * dt; return this.v; }
}
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const lerp = (a, b, t) => a + (b - a) * t;
const mixHex = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, "0")).join(""); };
const rot = (deg, x, y) => `rotate(${deg.toFixed(2)} ${x} ${y})`;

/* ---------- 背景（3層＋前景） ---------- */
const defs = el("defs", {}, svg);
const sky = el("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
const sky0 = el("stop", { offset: "0" }, sky), sky1 = el("stop", { offset: "1" }, sky);
el("rect", { x: 0, y: 0, width: 1600, height: 1000, fill: "url(#sky)" }, svg);
const sun = el("circle", { r: 70, fill: "#FFE27A", stroke: INK, "stroke-width": 6 }, svg);
const clouds = el("g", {}, svg);
const cloudList = [[200, 140, 1], [700, 90, .8], [1150, 170, 1.1], [1500, 110, .7]].map(([x, y, s]) => {
  const g = el("g", {}, clouds);
  el("path", { d: "M0 40 Q0 0 40 4 Q60 -24 100 0 Q140 -8 150 30 Q190 34 180 60 L10 60 Q-20 58 0 40 Z", fill: "#FFFFFF", stroke: INK, "stroke-width": 5, "stroke-linejoin": "round" }, g);
  return { g, x, y, s };
});

function makeChar(kind) {
  const root = el("g", {}, charLayer);
  const p = BUILD[kind](root);
  const tempo = p.tempo || 1;
  const sp = (v, k, d) => new Spring(v, k * tempo * tempo, d * tempo);
  return Object.assign(p, {
    kind, root, x: 0, y: 0, s: 1, tempo,
    jumpY: 0, jumpV: 0, squash: sp(1, 260, 12), lean: sp(0, 90, 9), headRot: sp(0, 120, 11), earL: sp(0, 200, 10), earR: sp(0, 200, 10),
    armL: sp(0, 140, 11), armR: sp(0, 140, 11), eyeScale: sp(1, 300, 18), mouthOpen: sp(0, 400, 24), dx: new Spring(0, 40, 9), lift: sp(0, 120, 12),
    headY: sp(0, 160, 13), eyeX: sp(0, 220, 18), eyeY: sp(0, 220, 18),
    blink: 1, nextBlink: 1 + Math.random() * 3, happyOn: false, roundMouth: false, listening: false, speakingLevel: 0, wave: 0,
    tm: {}, spinDur: 0.8, idleAt: 6 + Math.random() * 6, t: Math.random() * 10,
  });
}
function place(c, cx, base, s) { c.s = s; c.x = cx - 200 * s; c.y = base - c.base * s; }

function drawChar(c, dt, walking) {
  c.t += dt;
  const m = motion, T = c.tempo, tm = c.tm;
  for (const k in tm) { tm[k] -= dt; if (tm[k] <= 0) delete tm[k]; }
  if (c.jumpY < 0 || c.jumpV < 0) {
    c.jumpV += 3200 * dt; c.jumpY += c.jumpV * dt;
    if (c.jumpY >= 0) { c.jumpY = 0; c.squash.vel -= 2.2 * Math.min(1, Math.abs(c.jumpV) / 900); c.jumpV = 0; blip(180 / Math.sqrt(c.s), 90 / Math.sqrt(c.s), .05); }
  }
  [c.squash, c.lean, c.headRot, c.earL, c.earR, c.armL, c.armR, c.eyeScale, c.mouthOpen, c.dx, c.lift, c.headY, c.eyeX, c.eyeY].forEach(s => s.step(dt));
  if (!c.noBlink) {
    c.nextBlink -= dt;
    if (c.nextBlink < 0) { c.blink = 0; c.nextBlink = 2 + Math.random() * 3.5; if (Math.random() < .2) c.nextBlink = .18; }
    c.blink = Math.min(1, c.blink + dt * 7 * T);
  }
  let blinkS = c.blink < .5 ? 1 - c.blink * 1.8 : (c.blink - .5) * 2 * .9 + .1;
  if (tm.closed) blinkS = 0.08;
  if (tm.squint) blinkS = Math.min(blinkS, 0.35);
  const run = !!tm.run || walking;
  const walkPhase = run ? Math.sin(c.t * (tm.run ? 17 : 9) * T) : 0;
  let bob = run ? -Math.abs(walkPhase) * (tm.run ? 22 : 14) * m : 0;
  let headX = (c.listening ? Math.sin(c.t * 3) * 3 : 0) + c.speakingLevel * 3 * Math.sin(c.t * 18);
  let headYx = 0, leanX = 0, sqX = 0, dxX = 0, armLx = 0, armRx = 0, mouthX = 0;
  if (tm.shake) headX += Math.sin(c.t * 16) * 15;
  if (tm.nod) headYx += Math.abs(Math.sin(c.t * 7)) * 18;
  if (tm.shiver) dxX += Math.sin(c.t * 70) * 5;
  if (tm.dance) { const b = Math.sin(c.t * 7.3); leanX += b * 12; armLx += 70 + b * 50; armRx += -70 + b * 50; sqX += Math.abs(b) * 0.06; }
  if (tm.laugh) { sqX += Math.sin(c.t * 22) * 0.05; mouthX = 0.45 + 0.3 * Math.sin(c.t * 22); }
  if (tm.look) headX += Math.sin(c.t * 2.6) * 7;
  if (tm.pump) armRx += Math.sin(c.t * 14) * 28;
  if (tm.shy) leanX += Math.sin(c.t * 4) * 5;
  if (tm.tiptoe) bob += -Math.abs(Math.sin(c.t * 6)) * 10 * m;
  if (tm.clap) { const a = -40 + Math.sin(c.t * 7) * 18; armLx += a; armRx -= a; }
  let spinA = 0;
  if (tm.spin) { const p = Math.max(0, Math.min(1, 1 - tm.spin / c.spinDur)); spinA = 360 * p * p * (3 - 2 * p) * (c.spinTurns || 1); }
  const breathe = Math.sin(c.t * 2.2 * T) * 0.014 * m;
  const sq = 1 + (c.squash.v - 1 + sqX) * m, sx = 1 / Math.sqrt(sq), sy = sq + breathe;
  const jy = c.jumpY * m + bob;
  c.root.setAttribute("transform", `translate(${(c.x + (c.dx.v + dxX) * m).toFixed(1)} ${c.y}) scale(${c.s}) translate(0 ${jy.toFixed(1)}) ${rot(spinA, 200, c.base - 180)} ${rot((c.lean.v + leanX) * m, 200, c.base)} translate(200 ${c.base}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(-200 ${-c.base})`);
  let headUp = 0;
  if (c.neck) { const L = c.neck.len, k = (L + c.lift.v * m) / L; c.neck.g.setAttribute("transform", `translate(200 ${c.neck.bottom}) scale(1 ${k.toFixed(3)}) translate(-200 ${-c.neck.bottom})`); headUp = c.lift.v * m; }
  c.head.g.setAttribute("transform", `translate(0 ${(-headUp + (c.headY.v + headYx) * m).toFixed(1)}) ${rot((c.headRot.v + headX) * m, c.head.px, c.head.py)}`);
  if (c.tail) { const amp = tm.wag ? 28 : 10, spd = tm.wag ? 12 : 2.6; c.tail.g.setAttribute("transform", rot(Math.sin(c.t * spd) * amp * m, c.tail.px, c.tail.py)); }
  c.legs.forEach((l, i) => l.g.setAttribute("transform", rot((i ? -1 : 1) * walkPhase * 12 * m, l.px, l.py)));
  const waveA = c.wave > 0 ? Math.sin(c.t * 14) * 22 : 0;
  c.arms.forEach((a, i) => { const off = i ? c.armR.v + waveA + armRx : c.armL.v + armLx; a.g.setAttribute("transform", rot(a.rest + off * m, a.px, a.py)); });
  const flap = tm.clap && c.kind === "doshin" ? Math.sin(c.t * 7) * 14 : 0;
  c.ears.forEach((e, i) => e.g.setAttribute("transform", rot((i ? c.earR.v - flap : c.earL.v + flap) * m, e.px, e.py)));
  const es = c.eyeScale.v, ex = c.eyeX.v, ey = c.eyeY.v;
  c.eyes.forEach(e => {
    e.g.setAttribute("transform", `translate(${ex.toFixed(1)} ${ey.toFixed(1)}) translate(${e.cx} ${e.cy}) scale(${es.toFixed(3)} ${(es * blinkS).toFixed(3)}) translate(${-e.cx} ${-e.cy})`);
    if (c.happy) e.g.setAttribute("opacity", c.happyOn ? 0 : 1);
  });
  if (c.happy) c.happy.setAttribute("opacity", c.happyOn ? 1 : 0);
  if (c.closedEyes) { const open = es > 1.1; c.closedEyes.setAttribute("opacity", open ? 0 : 1); c.eyes.forEach(e => e.g.setAttribute("opacity", open ? 1 : 0)); }
  if (c.brows) c.brows.setAttribute("transform", `translate(0 ${(-(es - 1) * 40 - (c.kind === "gao" ? c.lift.v * .2 : 0)).toFixed(1)})`);
  if (c.blush) c.blush.setAttribute("opacity", c.headRot.t > 10 || tm.shy ? 1 : 0);
  if (c.glint) c.glint.setAttribute("opacity", c.lift.v > 40 ? 1 : 0);
  const o = Math.max(0, Math.min(1, Math.max(c.mouthOpen.v, c.speakingLevel, mouthX)));
  const M = c.mouth;
  if (M.type === "trunk") { M.g.setAttribute("transform", rot((Math.sin(c.t * 10) * Math.max(c.speakingLevel, mouthX) * 10 + c.mouthOpen.v * 12) * m, M.px, M.py)); return; }
  if (M.type === "jaw") { M.el.setAttribute("ry", (2 + o * 14).toFixed(1)); M.el.setAttribute("cy", (238 + o * 8).toFixed(1)); return; }
  const top = M.top, k = M.w / 22;
  if (c.roundMouth) {
    const r = (8 + o * 8) * k; M.path.setAttribute("fill", "#FF6F91");
    M.path.setAttribute("d", `M${M.x} ${top} m${-r} 0 a${r} ${r * 1.2} 0 1 0 ${r * 2} 0 a${r} ${r * 1.2} 0 1 0 ${-r * 2} 0`);
    M.tongue.setAttribute("rx", 0); M.tongue.setAttribute("ry", 0);
  } else if (o < 0.06) {
    M.path.setAttribute("d", c.sadMouth ? `M${M.x - 18 * k} ${top + 12} Q${M.x} ${top} ${M.x + 18 * k} ${top + 12}` : (M.closed || `M${M.x - 22 * k} ${top + 2} Q${M.x} ${top + 14 * k} ${M.x + 22 * k} ${top + 2}`));
    M.path.setAttribute("fill", "none"); M.tongue.setAttribute("rx", 0); M.tongue.setAttribute("ry", 0);
  } else {
    const w = (22 + 6 * o) * k, depth = (8 + 30 * o) * k;
    M.path.setAttribute("fill", "#FF6F91");
    M.path.setAttribute("d", `M${M.x - w} ${top} Q${M.x} ${top + 5 * k} ${M.x + w} ${top} Q${M.x} ${top + depth * 2} ${M.x - w} ${top} Z`);
    M.tongue.setAttribute("cy", top + depth * 0.68); M.tongue.setAttribute("rx", w * 0.45); M.tongue.setAttribute("ry", depth * 0.22);
  }
}

const later = (ms, f) => setTimeout(f, ms);
function jump(c, power = 1) { c.jumpV = -1100 * power * Math.sqrt(c.tempo); c.jumpY = -0.01; c.squash.vel += 1.6; }
function joy(c) {
  if (c.mouth.type !== "smile") { c.mouthOpen.t = .8; later(800, () => c.mouthOpen.t = 0); }
  jump(c, 1); c.happyOn = true; c.armL.t = 130; c.armR.t = -130; c.mouthOpen.t = .7; c.earL.t = 12; c.earR.t = -12;
  later(900, () => { c.armL.t = 0; c.armR.t = 0; c.mouthOpen.t = 0; c.earL.t = 0; c.earR.t = 0; });
  later(1300, () => { c.happyOn = false; });
}
function surprise(c) {
  jump(c, .55); c.eyeScale.t = 1.3; c.roundMouth = true; c.mouthOpen.t = .6; c.earL.t = 18; c.earR.t = -18; c.armL.t = 40; c.armR.t = -40;
  later(900, () => { c.eyeScale.t = 1; c.roundMouth = false; c.mouthOpen.t = 0; c.earL.t = 0; c.earR.t = 0; c.armL.t = 0; c.armR.t = 0; });
}
function flop(c) {
  c.lean.t = 38; c.squash.t = .82; c.headRot.t = 14; c.blink = 0; c.nextBlink = 1.2; c.armL.t = 50; c.armR.t = -50;
  blip(300, 120, .12, "sawtooth");
  later(750 / c.tempo, () => { c.lean.t = 0; c.squash.t = 1; c.headRot.t = 0; c.armL.t = 0; c.armR.t = 0; c.squash.vel += 1.2; blip(420, 700, .1); });
}
function wave(c) { c.armR.t = -130; c.wave = 1; c.headRot.t = -6; later(1600, () => { c.wave = 0; c.armR.t = 0; c.headRot.t = 0; }); }
function setListen(c, on) { c.listening = on; c.headRot.t = on ? -10 : 0; c.earL.t = on ? -14 : 0; c.earR.t = on ? 14 : 0; showEar(c, on); }

let ctx = null, analyser = null, buf = null;

}

    const src = ctx.createMediaElementSource(a); src.connect(analyser);
    speaker = c; say(c, text);
    a.onended = () => { speaker = null; c.speakingLevel = 0; unsay(c); res(); };

}

/* ---------- 紙吹雪 ---------- */
const bits = [];
function confetti(n = 70) {
  const cols = ["#FF6F91", "#FFD25E", "#7FCBF0", "#7CC36A", "#B9A8D9"];
  n = Math.round(n * Math.max(.15, motion));
  for (let i = 0; i < n; i++) {
    const r = el("rect", { width: 18, height: 10, rx: 3, fill: cols[i % cols.length], stroke: INK, "stroke-width": 2 }, fxLayer);
    bits.push({ r, x: 800 + (Math.random() - .5) * 300, y: 520, vx: (Math.random() - .5) * 900, vy: -700 - Math.random() * 600, a: Math.random() * 360, va: (Math.random() - .5) * 720, life: 2.4 });
  }
}
function stepBits(dt) {
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.vy += 1400 * dt; b.vx *= .99; b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt; b.life -= dt;
    b.r.setAttribute("transform", `translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) rotate(${b.a.toFixed(0)})`);

  { id: "roll", cat: "ちんじ", label: "ころころ", play: c => { c.spinDur = 1.6; c.spinTurns = 2; hold(c, "spin", 1.6); c.dx.t = 260; hold(c, "closed", 1.6);
      blip(300, 900, .8, "triangle"); later(1600, () => { c.dx.t = 0; c.squash.vel += 2; markAbove(c, "sparkle", { dx: 90 }); }); } },
  { id: "special", cat: "ちんじ", label: "その子らしく", play: c => { SPECIAL[c.kind](c); chime(); } },
];
// ふたりで（相手がいるときだけ）
const DUO = [
  { id: "highfive", label: "ハイタッチ", play: (a, b) => {
      const ca = a.x + 200 * a.s, cb = b.x + 200 * b.s, gap = Math.max(0, (cb - ca) / 2 - 105 * (a.s + b.s));
      a.dx.t = gap; b.dx.t = -gap; a.armR.t = -150; b.armL.t = 150; a.lean.t = -6; b.lean.t = 6;
      later(650, () => { noise(.09, 2200, .5); const p = world(a, 200, 140); [0, 1, 2, 3, 4, 5].forEach(i => { const an = i / 6 * Math.PI * 2; mark("sparkle", ca + gap + 40, p.y, { vx: Math.cos(an) * 260, vy: Math.sin(an) * 260, life: .7, s: .7 }); });
        a.happyOn = b.happyOn = true; jump(a, .4); jump(b, .4); });
      later(1300, () => { a.dx.t = 0; b.dx.t = 0; a.armR.t = 0; b.armL.t = 0; a.lean.t = 0; b.lean.t = 0; a.happyOn = b.happyOn = false; }); } },
  { id: "bow2", label: "いっしょに おじぎ", play: (a, b) => { MOVES.find(m => m.id === "bow").play(a); later(150, () => MOVES.find(m => m.id === "bow").play(b)); } },
  { id: "dance2", label: "いっしょに おどる", play: (a, b) => { MOVES.find(m => m.id === "dance").play(a); hold(b, "dance", 2.6); b.happyOn = true; later(2600, () => b.happyOn = false); } },
  { id: "cheer2", label: "はげまして もらう", play: (a, b) => { MOVES.find(m => m.id === "sad").play(a); later(900, () => MOVES.find(m => m.id === "cheer").play(b)); later(2600, () => MOVES.find(m => m.id === "pump").play(a)); } },
];

/* ---------- ひまなときの小さな動き ---------- */
const IDLE = ["look", "nod", "think", "sleepy"];
function idleTick(c, dt, busy) {
  if (busy || c === speaker || Object.keys(c.tm).length) { c.idleAt = Math.max(c.idleAt, 4); return; }
  c.idleAt -= dt;
  if (c.idleAt < 0) {
    c.idleAt = 7 + Math.random() * 7;
    const r = Math.random();
    const pick = id => MOVES.find(m => m.id === id).play(c);
    if (r < .08) pick(Math.random() < .5 ? "sneeze" : "hiccup");
    else if (r < .5) { c.earL.vel += 120; c.earR.vel -= 120; c.headRot.vel += (Math.random() - .5) * 60; }
    else pick(IDLE[Math.floor(Math.random() * IDLE.length)]);
  }
}

/* ---------- 並べ方 ---------- */
const KINDS = ["doshin", "nobbo", "kamejii", "meebaa", "pony", "shima", "pyon", "mii", "gao", "chu"];
const C = {}; KINDS.forEach(k => C[k] = makeChar(k));
const chars = KINDS.map(k => C[k]);
const FRIENDS = ["doshin", "nobbo", "gao", "chu", "pyon", "mii", "kamejii", "meebaa"];
const SOLO = { doshin: [1150, 2.6], nobbo: [1060, 1.12], gao: [1060, 1.0], chu: [1060, .34], pyon: [1060, .95], mii: [1060, .95], kamejii: [1040, .95], meebaa: [1060, .95] };
const LINEUP = [["doshin", 110, 1.25], ["nobbo", 330, .62], ["kamejii", 480, .5], ["meebaa", 620, .5], ["pony", 760, .5], ["shima", 900, .5], ["pyon", 1040, .5], ["mii", 1180, .5], ["gao", 1330, .52], ["chu", 1470, .18]];
let mode = "solo", sel = "gao", visible = [];

/* 吹き出しと耳の印（1つずつ使い回す） */
const bub = el("g", { opacity: 0 }, fxLayer);
const bubR = el("rect", { rx: 26, fill: "#FFFFFF", stroke: INK, "stroke-width": 5 }, bub);
const bubTip = el("path", { fill: "#FFFFFF", stroke: INK, "stroke-width": 5, "stroke-linejoin": "round" }, bub);
const bubT = el("text", { "font-family": "Zen Maru Gothic, sans-serif", "font-weight": 700, "font-size": 40, fill: INK, "text-anchor": "middle" }, bub);
function say(c, text) {
  bubT.textContent = text;
  const w = Math.min(1500, text.length * 40 + 64), cx = Math.max(w / 2 + 20, Math.min(1580 - w / 2, c.x + 200 * c.s));
  const headTop = c.y + c.top * c.s, y = Math.max(110, headTop - 30), tipX = Math.max(60, Math.min(1540, c.x + 200 * c.s));
  bubR.setAttribute("x", cx - w / 2); bubR.setAttribute("y", y - 74); bubR.setAttribute("width", w); bubR.setAttribute("height", 84);
  bubTip.setAttribute("d", `M${tipX - 18} ${y + 8} L${tipX} ${y + 38} L${tipX + 18} ${y + 8}`);
  bubT.setAttribute("x", cx); bubT.setAttribute("y", y - 18); bub.setAttribute("opacity", 1);
}
function unsay() { bub.setAttribute("opacity", 0); }
const ear = el("g", { opacity: 0 }, fxLayer);
el("circle", { cx: 0, cy: 0, r: 44, fill: "#FFD25E", stroke: INK, "stroke-width": 5 }, ear);
el("path", { d: "M-10 22 Q-24 22 -22 6 Q-20 -2 -14 -8 Q-16 -30 4 -30 Q22 -30 20 -10 Q18 4 6 10", fill: "none", stroke: INK, "stroke-width": 6, "stroke-linecap": "round" }, ear);
function showEar(c, on) { if (c !== C.shima || mode !== "solo") { ear.setAttribute("opacity", 0); return; } ear.setAttribute("transform", `translate(${c.x + 200 * c.s - 150} ${c.y + 40 * c.s})`); ear.setAttribute("opacity", on ? 1 : 0); }

function layout() {
  chars.forEach(c => c.root.style.display = "none"); visible = []; unsay(); showEar(C.shima, false);
  const show = c => { c.root.style.display = ""; visible.push(c); };
  if (mode === "solo") { place(C.shima, 330, 975, .78); show(C.shima); const [cx, s] = SOLO[sel]; place(C[sel], cx, 975, s); show(C[sel]); }
  else LINEUP.forEach(([k, cx, s]) => { place(C[k], cx, 975, s); show(C[k]); });
}

/* ---------- ボタン ---------- */
const chipsBox = document.getElementById("chips");
FRIENDS.forEach(k => {
  const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = NAMES[k]; b.dataset.k = k;
  b.setAttribute("aria-pressed", k === sel); chipsBox.appendChild(b);
  b.onclick = () => { sel = k; chipsBox.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x.dataset.k === k)); if (mode === "all") setMode("solo"); else layout(); later(80, () => wave(C[sel])); };
});
function setMode(m) { mode = m; document.querySelectorAll(".mode").forEach(b => b.setAttribute("aria-pressed", b.id === "m-" + m)); layout(); }
document.getElementById("m-solo").onclick = () => setMode("solo");
document.getElementById("m-all").onclick = () => { setMode("all"); audio(); visible.forEach((c, i) => later(i * 110, () => jump(c, .6))); };
let busy = false;
document.getElementById("b-talk").onclick = async () => {
  if (busy) return; busy = true; audio(); const f = C[sel];
  if (mode === "solo") setListen(C.shima, true);
  await speak(f, sel, LINES[sel]);
  if (mode === "solo") { setListen(C.shima, false); C.shima.headRot.t = 8; later(500, () => C.shima.headRot.t = 0); }
  busy = false;
};
function forTargets(fn) { audio(); if (mode === "solo") fn(C[sel], 0); else visible.forEach((c, i) => later(i * 120, () => fn(c, i))); }
const box = document.getElementById("moves");
function rowOf(label) { const r = document.createElement("div"); r.className = "row"; r.setAttribute("role", "group"); r.setAttribute("aria-label", label);
  const l = document.createElement("span"); l.className = "lab"; l.textContent = label; r.appendChild(l); box.appendChild(r); return r; }
function btnIn(r, label, fn) { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = fn; r.appendChild(b); }
[...new Set(MOVES.map(m => m.cat))].forEach(cat => { const r = rowOf(cat); MOVES.filter(m => m.cat === cat).forEach(m => btnIn(r, m.label, () => {
  forTargets(c => m.play(c)); if (cat === "よろこぶ") confetti(mode === "all" ? 80 : 40); })); });
const duoRow = rowOf("ふたりで");
DUO.forEach(d => btnIn(duoRow, d.label, () => { audio();
  if (mode === "solo") d.play(C.shima, C[sel]);
  else for (let i = 0; i + 1 < visible.length; i += 2) { const a = visible[i], b = visible[i + 1]; later(i * 60, () => d.play(a, b)); } }));
document.getElementById("b-random").onclick = () => { const pool = MOVES.filter(m => m.cat !== "ちんじ" || Math.random() < .3); const m = pool[Math.floor(Math.random() * pool.length)]; forTargets(c => m.play(c)); };
let idleOn = true;
document.getElementById("b-idle").onclick = e => { idleOn = !idleOn; e.currentTarget.setAttribute("aria-pressed", idleOn); };
let walking = false;
document.getElementById("b-walk").onclick = e => { walking = !walking; e.currentTarget.setAttribute("aria-pressed", walking); };
document.getElementById("tod").oninput = e => setTimeOfDay(e.target.value / 100);
document.getElementById("motion").oninput = e => { motion = e.target.value / 100; };
if (reduce) document.getElementById("motion").value = 30;

/* ---------- 毎フレーム ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  const lv = level();
  visible.forEach(c => { c.speakingLevel = c === speaker ? lerp(c.speakingLevel, lv, .5) : lerp(c.speakingLevel, 0, .3); });
  if (walking) { const sp = 160 * dt * Math.max(.2, motion); [[far, .15], [mid, .45], [near, 1], [front, 1.7]].forEach(([L, k]) => { L.off = (L.off + sp * k) % L.width; L.g.setAttribute("transform", `translate(${-L.off.toFixed(1)} 0)`); }); }
  cloudList.forEach(cl => { cl.x -= dt * 14 * cl.s * Math.max(.2, motion); if (cl.x < -220) cl.x = 1700; cl.g.setAttribute("transform", `translate(${cl.x.toFixed(1)} ${cl.y}) scale(${cl.s})`); });
  visible.forEach(c => { if (idleOn) idleTick(c, dt, busy); drawChar(c, dt, walking); });
  stepBits(dt); stepMarks(dt);
  requestAnimationFrame(frame);
}
setTimeOfDay(.25); layout(); requestAnimationFrame(frame);
</script>
